<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neeraj Hanumante</title>
  <meta name="description" content="Neeraj Hanumante — Decarbonization, LCA, and energy systems." />

  <style>
    :root{
      --deg:#2563eb;   /* Degree */
      --pro:#16a34a;   /* Professional */
      --line:#d9d9d9;
      --soft:#fafafa;
      --ink:#111;
    }

    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0}
    .wrap{max-width:980px;margin:0 auto;padding:56px 18px}
    h1{font-size:38px;margin:0}
    .tag{font-size:16px;opacity:.9;margin:8px 0 16px}
    h2{font-size:22px;margin:34px 0 10px}
    p{font-size:18px;line-height:1.55;margin:10px 0 18px}
    ul{margin:8px 0 18px 22px;font-size:18px;line-height:1.55}

    /* Header */
    .topbar{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
    .nameblock{min-width:260px}
    .navbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .navbtns a{display:inline-block;padding:10px 12px;border:1px solid #111;border-radius:10px;text-decoration:none;color:#111}
    .navbtns a:hover{background:#f3f3f3}

    /* Cards */
    .card{border:1px solid #ddd;border-radius:14px;padding:16px 16px;margin:14px 0;background:#fff}
    .meta{font-size:14px;opacity:.8;margin-top:10px}

    /* Legend */
    .legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 6px}
    .legend-note{font-size:13px;opacity:.75}
    .legend-hint{margin-left:auto;font-size:12px;opacity:.6;white-space:nowrap;}
    @media (max-width:720px){ .legend-hint{margin-left:0;opacity:.7} }
    .pill{display:inline-flex;gap:8px;align-items:center;font-size:13px;border:1px solid #111;border-radius:999px;padding:4px 10px;opacity:.95;}
    .dot{width:10px;height:10px;border-radius:50%}
    .dot.degree{background:var(--deg)}
    .dot.prof{background:var(--pro)}

    /* ===== Timeline ===== */
    .timeline-wrap{margin-top:10px}
    .timeline{
      position:relative;
      border:1px solid #eee;
      border-radius:14px;
      padding:14px 14px;
      background:var(--soft);
      overflow:visible;
    }
    .timeline .rail{
      position:relative;
      height:160px;
      padding:0;
      --railY: 80px;
    }
    .rail-line{
      position:absolute;
      left:18px; right:18px;
      top:var(--railY);
      height:3px;
      background:var(--line);
      border-radius:999px;
    }

    /* Ranges (bars + ticks) */
    .ranges{
      position:absolute;
      left:18px; right:18px;
      top:0;
      height:100%;
      pointer-events:none;
      z-index:1;
    }
    .range{
      position:absolute;
      top:var(--railY);
      height:0;
    }
    .range .bar{
      position:absolute;
      left:0;
      top:10px;
      height:12px;
      width:100%;
      border-radius:999px;
      opacity:.14;
    }
    .range .tick{
      position:absolute;
      top:6px;
      width:2px;
      height:20px;
      border-radius:2px;
      opacity:.55;
    }
    .range.prof .bar{ background:var(--pro); }
    .range.prof .tick{ background:var(--pro); }
    .range.mixed .bar{
      background: linear-gradient(90deg, var(--deg) 0 50%, var(--pro) 50% 100%);
    }
    .range.mixed .tick{ background:var(--ink); opacity:.38; }

    .range[data-label]{ pointer-events:auto; cursor:help; }
    .range[data-label]:hover::after{
      content:attr(data-label);
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      top:32px;
      background:#fff;
      border:1px solid #ddd;
      border-radius:10px;
      padding:6px 10px;
      font-size:12px;
      white-space:nowrap;
      box-shadow:0 10px 30px rgba(0,0,0,.10);
      opacity:.97;
    }

    /* Milestones */
    .milestones{
      position:absolute;
      left:18px; right:18px;
      top:0;
      height:100%;
      z-index:2;
    }
    .ms{
      position:absolute;
      top:var(--railY);
      transform:translateX(-50%);
      text-align:center;
      user-select:none;
      cursor:pointer;
    }
    .ms a{
      position:relative;
      display:block;
      padding:54px 10px 60px;
      border-radius:12px;
      text-decoration:none;
      color:inherit;
      outline:none;
    }
    .ms a:focus{ box-shadow:0 0 0 3px rgba(17,17,17,.15); }

    .ms .bubble{
      position:absolute;
      left:50%;
      top:0;
      transform:translate(-50%,-50%);
      width:16px;height:16px;border-radius:50%;
      border:2px solid var(--ink);
      background:var(--ink);
      box-shadow:0 0 0 3px var(--soft);
    }
    .ms.degree .bubble{ background:var(--deg); border-color:var(--deg); }
    .ms.prof   .bubble{ background:var(--pro); border-color:var(--pro); }
    .ms.mixed  .bubble{
      border-color:rgba(17,17,17,.65);
      background:linear-gradient(90deg, var(--deg) 0 50%, var(--pro) 50% 100%);
    }

    .ms .when{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      top:-26px;
      font-size:12px;
      opacity:.78;
      white-space:nowrap;
    }

    .ms .label{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      font-size:12px;
      opacity:.92;
      line-height:1.2;
      white-space:nowrap;
      max-width:110px;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .ms.pos-bottom .label{ top:22px; }
    .ms.pos-top    .label{ top:-54px; }

    .ms:hover .label{ text-decoration:underline; text-underline-offset:3px; }
    .ms:hover .bubble{ transform:translate(-50%,-50%) scale(1.06); }
    .ms:focus-within .bubble{ transform:translate(-50%,-50%) scale(1.08); }

    .ms.current .bubble{
      box-shadow:
        0 0 0 3px var(--soft),
        0 0 0 7px rgba(22,163,74,.18);
    }
    .ms .nowtag{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      top:38px;
      font-size:11px;
      border:1px solid rgba(17,17,17,.45);
      border-radius:999px;
      padding:2px 8px;
      background:#fff;
      opacity:.9;
    }

    .ms.edge-left  .label, .ms.edge-left  .when{ left:0; transform:none; text-align:left; }
    .ms.edge-right .label, .ms.edge-right .when{ left:auto; right:0; transform:none; text-align:right; }

    /* ===== Modal ===== */
    dialog#milestoneDialog{
      border:none;
      padding:0;
      max-width:760px;
      width:calc(100% - 32px);
      border-radius:16px;
      box-shadow:0 20px 60px rgba(0,0,0,.25);
    }
    dialog::backdrop{background:rgba(0,0,0,.35)}
    .modal-head{
      display:flex;gap:12px;justify-content:space-between;align-items:flex-start;
      padding:16px 16px 12px;border-bottom:1px solid #eee;background:#fff;border-top-left-radius:16px;border-top-right-radius:16px
    }
    .modal-title{margin:0;font-size:18px;line-height:1.25}
    .modal-sub{font-size:12px;opacity:.8;margin-top:6px}
    .modal-close{
      border:1px solid #111;background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;
      line-height:1;font-size:14px;
    }
    .modal-close:hover{background:#f3f3f3}
    .modal-body{padding:14px 16px 16px;background:#fff;border-bottom-left-radius:16px;border-bottom-right-radius:16px}
    .modal-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
    .badge{font-size:12px;border:1px solid #111;border-radius:999px;padding:3px 9px;opacity:.9}
    .badge.degree{border-color:var(--deg);color:var(--deg)}
    .badge.prof{border-color:var(--pro);color:var(--pro)}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 10px}
    .chip{font-size:13px;border:1px solid #111;border-radius:999px;padding:4px 10px;opacity:.9}
    .mini-steps{
      margin:10px 0 8px;
      padding:10px 10px;
      background:#fafafa;
      border:1px solid #eee;
      border-radius:12px;
      font-size:13px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .mini-steps .k{opacity:.75}
    .mini-steps .v{font-weight:650}
    .modal-meta{font-size:14px;opacity:.85;margin-top:10px}
    .modal-body ul{margin:8px 0 0 22px;font-size:16px;line-height:1.5}

    /* ===== Projects ===== */
    .proj-card{border:1px solid #ddd;border-radius:14px;padding:16px;margin:14px 0;background:#fff}
    .proj-intro{font-size:16px;opacity:.9;margin:6px 0 0}
    .proj-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
    .proj details{border:1px solid #ddd;border-radius:14px;background:#fff;margin:0}
    .proj details > summary{
      list-style:none;cursor:pointer;padding:14px 14px;
      display:flex;gap:12px;align-items:baseline;justify-content:space-between;font-weight:650;
    }
    .proj details > summary::-webkit-details-marker{display:none}
    .proj .group-meta{font-size:12px;opacity:.75;white-space:nowrap}
    .proj .group-body{padding:0 14px 14px}
    .proj .proj-item{border-top:1px solid #eee;padding-top:12px;margin-top:12px}
    .proj .proj-item:first-child{border-top:none;padding-top:0;margin-top:0}
    .proj .proj-title{margin:0;font-size:16px}
    .proj .proj-title a{text-decoration:none;color:inherit}
    .proj .proj-title a:hover{text-decoration:underline;text-underline-offset:3px}
    .proj .proj-sub{font-size:13px;opacity:.8;margin:6px 0 8px}
    .proj .proj-item ul{margin:6px 0 0 22px;font-size:16px;line-height:1.5}

    .proj-link{
      display:inline-block;
      border:1px solid rgba(17,17,17,.35);
      border-radius:999px;
      padding:2px 8px;
      font-size:12px;
      text-decoration:none;
      color:inherit;
      opacity:.9;
      margin-left:6px;
    }
    .proj-link:hover{background:#f3f3f3}

    /* Mobile */
    @media (max-width: 720px){
      dialog#milestoneDialog{width:calc(100% - 20px)}
      .timeline .rail{height:175px; --railY: 90px;}
      .ms .label{max-width:92px}
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="nameblock">
        <h1 id="siteName">Neeraj Hanumante</h1>
        <div class="tag" id="siteTagline"></div>

    <h2>Career trajectory</h2>
    <div class="card timeline-wrap">

      <div class="timeline" role="navigation" aria-label="Career timeline">

  <!-- Modal -->
  <dialog id="milestoneDialog" aria-label="Milestone details">

        <div class="modal-badges" id="mdBadges"></div>

        <div class="modal-sub" id="mdSub"></div>

    // =========================

    const CONTENT = {
      focus: [

    const PROJECTS = [
      {

      {
        groupId: "few",

        meta: "Scenario design • sensitivity",
        items: [
          {

            title: "Water-stress & scarcity-pricing module (global FEW framework)",
            sub: "6 regions × 3 sectors • structured scenarios",
            bullets: [

    // =========================
    // UTILITIES (rarely edit)
    // =========================
    const $ = (sel, root=document) => root.querySelector(sel);
    const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

    function escapeHtml(s){
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function pctFromYear(y){
      const min = CAREER.startYear;
      const max = CAREER.endYear;
      return ((y - min) / (max - min)) * 100;
    }

    function rectsOverlap(a, b){
      return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
    }

    // =========================
    // RENDERERS
    // =========================
    function renderSite(){
      $("#siteName").textContent = SITE.name;
      $("#siteNameFooter").textContent = SITE.name;
      $("#siteTagline").textContent = SITE.tagline;
      $("#introText").textContent = SITE.intro;

      const nav = $("#navBtns");
      nav.innerHTML = SITE.nav.map(n => `<a href="${escapeHtml(n.href)}">${escapeHtml(n.label)}</a>`).join("");
    }

    function renderLists(){
      $("#focusCard").innerHTML = `
        <ul>
          ${CONTENT.focus.map(x => `<li><b>${escapeHtml(x.b)}</b>${escapeHtml(x.t)}</li>`).join("")}
        </ul>
      `;
      $("#highlightsCard").innerHTML = `
        <ul>
          ${CONTENT.highlights.map(h => `<li>${h}</li>`).join("")}
        </ul>
      `;
    }

    function renderRanges(){
      const wrap = $("#ranges");
      wrap.innerHTML = "";

      CAREER.ranges.forEach(r => {
        const leftPct = pctFromYear(r.start);
        const rightPct = pctFromYear(r.end);
        const widthPct = Math.max(0, rightPct - leftPct);

        const el = document.createElement("div");
        el.className = `range ${r.type}`;
        el.style.left = leftPct + "%";
        el.style.width = widthPct + "%";
        if(r.label) el.dataset.label = r.label;

        el.innerHTML = `<div class="bar"></div>` + (r.steps || []).map(stepYear => {
          if(stepYear < r.start || stepYear > r.end) return "";
          const pos = ((stepYear - r.start) / (r.end - r.start)) * 100;
          return `<div class="tick" style="left:${pos}%"></div>`;
        }).join("");

        wrap.appendChild(el);
      });
    }

    function renderMilestones(){
      const wrap = $("#milestones");
      wrap.innerHTML = "";

      CAREER.milestones.forEach(m => {
        const left = pctFromYear(m.year);
        const type = m.type; // degree | prof | mixed
        const currentClass = m.current ? " current" : "";
        const id = `m-${m.id}`;

        const ms = document.createElement("div");
        ms.className = `ms ${type}${currentClass}`;
        ms.style.left = `${left}%`;
        ms.title = `${m.subtitle} • ${m.label}`;

        ms.innerHTML = `
          <a href="#${id}" data-open="${m.id}">
            <div class="when">${escapeHtml(String(Math.floor(m.year)))}</div>
            <div class="bubble" aria-hidden="true"></div>
            <div class="label"><b>${escapeHtml(m.label)}</b></div>
            ${m.current ? `<span class="nowtag" aria-hidden="true">Now</span>` : ``}
          </a>
        `;
        wrap.appendChild(ms);
      });

      // click handler
      $$('[data-open]').forEach(a => {
        a.addEventListener("click", (e) => {
          e.preventDefault();
          const key = a.getAttribute("data-open");
          openMilestone(key);
        });
      });

      applySoftAlternation();
    }

    function applySoftAlternation(){
      const wrap = $("#milestones");
      const ms = $$(".ms", wrap);

      ms.sort((a,b) => parseFloat((a.style.left||"0").replace("%","")) - parseFloat((b.style.left||"0").replace("%","")));
      ms.forEach(el => el.classList.remove("pos-top","pos-bottom","edge-left","edge-right"));

      ms.forEach(el => {
        const left = parseFloat((el.style.left || "0").replace("%",""));
        if(left <= 3) el.classList.add("edge-left");
        if(left >= 97) el.classList.add("edge-right");
      });

      ms.forEach((el, i) => el.classList.add(i % 2 === 0 ? "pos-bottom" : "pos-top"));

      const current = ms.find(el => el.classList.contains("current"));
      if(current){
        current.classList.remove("pos-top");
        current.classList.add("pos-bottom");
      }

      function resolve(sideClass){
        const group = ms.filter(el => el.classList.contains(sideClass));
        let lastRect = null;

        group.forEach(el => {
          const label = el.querySelector(".label");
          if(!label) return;
          const r = label.getBoundingClientRect();
          if(lastRect && rectsOverlap(r, lastRect)){
            el.classList.toggle("pos-top");
            el.classList.toggle("pos-bottom");
          } else {
            lastRect = r;
          }
        });
      }

      resolve("pos-top");
      resolve("pos-bottom");
      resolve("pos-top");
    }

    function renderProjects(){
      const mount = $("#projectsMount");
      mount.innerHTML = `
        <p class="proj-intro">
          Explore project summaries by theme. Links inside the career timeline open the relevant project automatically.
        </p>
        <div class="proj-grid">
          ${PROJECTS.map(g => `
            <details data-proj-group="${escapeHtml(g.groupId)}">
              <summary>
                <span>${escapeHtml(g.title)}</span>
                <span class="group-meta">${escapeHtml(g.meta || "")}</span>
              </summary>
              <div class="group-body">
                ${g.items.map(it => `
                  <div class="proj-item" id="${escapeHtml(it.id)}">
                    <h3 class="proj-title">
                      <a href="#${escapeHtml(it.id)}">${escapeHtml(it.title)}</a>
                    </h3>
                    ${it.sub ? `<div class="proj-sub">${escapeHtml(it.sub)}</div>` : ``}
                    ${it.bullets?.length ? `<ul>${it.bullets.map(b => `<li>${escapeHtml(b)}</li>`).join("")}</ul>` : ``}
                  </div>
                `).join("")}
              </div>
            </details>
          `).join("")}
        </div>
      `;
    }

    // =========================
    // MODAL + PROJECT DEEPLINKS
    // =========================
    const dialog = $("#milestoneDialog");
    const mdTitle = $("#mdTitle");
    const mdSub   = $("#mdSub");
    const mdBody  = $("#mdBody");
    const mdBadges= $("#mdBadges");

    $("#mdClose").addEventListener("click", () => dialog.close());
    dialog.addEventListener("click", (e) => {
      const rect = dialog.getBoundingClientRect();
      const inDialog = (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom);
      if(!inDialog) dialog.close();
    });

    function badgeHtml(type){
      if(type === "mixed"){
        return `<span class="badge degree">Degree</span><span class="badge prof">Professional</span>`;
      }
      if(type === "degree") return `<span class="badge degree">Degree</span>`;
      return `<span class="badge prof">Professional</span>`;
    }

    function openMilestone(key){
      const m = CAREER.milestones.find(x => x.id === key);
      if(!m) return;

      mdBadges.innerHTML = badgeHtml(m.type);
      mdTitle.textContent = m.title;
      mdSub.textContent = m.subtitle;

      const chipsHtml = (m.chips?.length)
        ? `<div class="chips">${m.chips.map(c => `<span class="chip">${escapeHtml(c)}</span>`).join("")}</div>`
        : "";

      const miniHtml = (m.miniSteps?.v?.length)
        ? `<div class="mini-steps"><span class="k">${escapeHtml(m.miniSteps.k)}</span> ${m.miniSteps.v.map(v => `<span class="v">${escapeHtml(v)}</span>`).join(" → ")}</div>`
        : "";

      const bulletsHtml = (m.bullets?.length)
        ? `<ul>${m.bullets.map(b => `<li>${escapeHtml(b)}</li>`).join("")}</ul>`
        : "";

      const metaLines = [...(m.meta || [])];

      // Optional: auto-add Projects links if milestone references projects
      if(m.projects?.length){
        const links = m.projects.map(pid => `<a class="proj-link" href="#${escapeHtml(pid)}">${escapeHtml(projectTitleById(pid) || pid)}</a>`).join("");
        metaLines.push(`Projects: ${links}`);
      }

      const metaHtml = metaLines.length
        ? metaLines.map(line => `<div class="modal-meta">${line}</div>`).join("")
        : "";

      mdBody.innerHTML = `${miniHtml}${chipsHtml}${bulletsHtml}${metaHtml}`;

      if(typeof dialog.showModal === "function") dialog.showModal();
      else dialog.setAttribute("open","open");

      try { history.replaceState(null, "", "#m-" + m.id); } catch(e) {}
    }

    function projectTitleById(pid){
      for(const g of PROJECTS){
        const found = g.items.find(it => it.id === pid);
        if(found) return found.title;
      }
      return null;
    }

    function openProjectFromHash(hash){
      if(!hash || !hash.startsWith("#p-")) return false;
      const target = document.querySelector(hash);
      if(!target) return false;

      const groupDetails = target.closest('.proj details');
      if(groupDetails) groupDetails.open = true;

      target.scrollIntoView({ behavior: "smooth", block: "start" });
      return true;
    }

    document.addEventListener("click", (e) => {
      const a = e.target.closest('a[href^="#p-"]');
      if(!a) return;
      if(dialog && dialog.open) dialog.close();
      const hash = a.getAttribute("href");
      setTimeout(() => openProjectFromHash(hash), 0);
    });

    // =========================
    // INIT
    // =========================
    function init(){
      renderSite();
      renderLists();
      renderRanges();
      renderMilestones();
      renderProjects();

      $("#yr").textContent = new Date().getFullYear();

      // open from hash
      const hash = location.hash || "";
      if(hash.startsWith("#m-")){
        const key = hash.replace("#m-","");
        openMilestone(key);
      } else if(hash.startsWith("#p-")){
        openProjectFromHash(hash);
      }
    }

    window.addEventListener("load", init);
    window.addEventListener("resize", () => {
      renderRanges();
      requestAnimationFrame(applySoftAlternation);
    });
    window.addEventListener("hashchange", () => {
      if(location.hash.startsWith("#p-")) openProjectFromHash(location.hash);
      if(location.hash.startsWith("#m-")) openMilestone(location.hash.replace("#m-",""));
    });
  </script>
</body>
</html>
